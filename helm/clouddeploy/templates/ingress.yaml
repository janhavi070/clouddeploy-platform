apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: clouddeploy-ingress
  namespace: {{ .Values.namespace }}

spec:
  ingressClassName: nginx

  rules:
    - host: {{ .Values.ingress.host }}

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: clouddeploy-service

                port:
                  number: {{ .Values.service.port }}
