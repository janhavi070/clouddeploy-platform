replicaCount: 1

namespace: clouddeploy

app:
  name: clouddeploy-app
  label: clouddeploy
  containerName: clouddeploy-container

image:
  repository: janhavi070/clouddeploy-platform
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: nginx

  host: clouddeploy.local

  path: /

config:

  appName: "CloudDeploy Platform"

  environment: development

  version: "1.0.0"

  buildNumber: "local"

  gitCommit: "unknown"

secret:

  dbUsername: admin

  dbPassword: supersecret123

resources:

  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 250m
    memory: 256Mi

probes:

  readiness:

    path: /health

    initialDelaySeconds: 5

    periodSeconds: 5

  liveness:

    path: /health

    initialDelaySeconds: 10

    periodSeconds: 10
