apiVersion: apps/v1
kind: Deployment

metadata:
  name: clouddeploy-app
  namespace: clouddeploy

spec:
  replicas: 1

  selector:
    matchLabels:
      app: clouddeploy

  template:
    metadata:
      labels:
        app: clouddeploy

    spec:
      containers:
        - name: clouddeploy-container
          image: clouddeploy-platform:latest
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: clouddeploy-config
            - secretRef:
                name: clouddeploy-secret

          ports:
            - containerPort: 5000

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"
